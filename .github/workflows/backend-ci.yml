name: Backend CI Pipeline

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose*.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - 'docker-compose*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. REPOSITORY HYGIENE & STATIC VALIDATION
  # ----------------------------------------------------------------------------
  hygiene-and-lint:
    name: Repository Hygiene & Script Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Committed Secrets
        run: |
          echo "Checking for accidentally committed private keys or credentials..."
          FOUND_KEYS=$(find . -maxdepth 4 -not -path "*/.*" \( -name "*.pem" -o -name "*.key" -o -name "*.p12" \) | grep -v "target/" || true)
          if [ -n "$FOUND_KEYS" ]; then
            echo "ERROR: Found committed private keys: $FOUND_KEYS"
            exit 1
          fi
          echo "No sensitive key files found in repository."

      - name: Validate Shell Scripts Syntax
        run: |
          echo "Validating bash syntax for operational scripts..."
          if [ -d "scripts" ]; then
            for script in scripts/*.sh; do
              if [ -f "$script" ]; then
                bash -n "$script"
                echo "Syntax valid: $script"
              fi
            done
          fi

      - name: Validate YAML / Compose Syntax
        run: |
          python3 -c "
          import yaml, glob
          yaml_files = glob.glob('*.yml') + glob.glob('*.yaml') + glob.glob('backend/*.yml') + glob.glob('.github/workflows/*.yml')
          for f in yaml_files:
              with open(f, 'r') as fp:
                  yaml.safe_load(fp)
              print(f'YAML Valid: {f}')
          "

  # ----------------------------------------------------------------------------
  # 2. COMPILE, AUTOMATED TESTS & COVERAGE
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest
    needs: hygiene-and-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate Dummy Test RSA Keypair
        run: |
          mkdir -p target/test-secrets
          openssl genpkey -algorithm RSA -out target/test-secrets/jwt-private.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in target/test-secrets/jwt-private.pem -out target/test-secrets/jwt-public.pem
          echo "Generated test RSA keys."

      - name: Execute Automated Test Suite (Unit & Integration)
        env:
          APP_PROFILE: test
          JWT_PRIVATE_KEY_PATH: target/test-secrets/jwt-private.pem
          JWT_PUBLIC_KEY_PATH: target/test-secrets/jwt-public.pem
        run: |
          ./mvnw clean test --batch-mode --no-transfer-progress

      - name: Package Executable JAR
        run: |
          ./mvnw package -DskipTests --batch-mode --no-transfer-progress

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # 3. DEPENDENCY SECURITY & VULNERABILITY AUDIT
  # ----------------------------------------------------------------------------
  security-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    needs: hygiene-and-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Dependency Tree & Vulnerability Scan
        run: |
          ./mvnw dependency:tree -Dverbose --batch-mode --no-transfer-progress

  # ----------------------------------------------------------------------------
  # 4. DOCKER IMAGE BUILD & CONTAINER HEALTH CHECK
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker Image Build & Health Verification
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: projeto-final-api:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Non-Root User & Execution
        run: |
          docker run --rm --entrypoint id projeto-final-api:test
          docker run --rm --entrypoint java projeto-final-api:test -version
