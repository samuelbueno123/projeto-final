# ==============================================================================
# DOCKER COMPOSE - DESENVOLVIMENTO LOCAL (OVERRIDE PADRÃO)
# Carregado automaticamente pelo comando: docker compose up
# ==============================================================================

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks:
      - backend-net
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ancora.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
