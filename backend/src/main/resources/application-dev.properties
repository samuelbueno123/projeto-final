# ===============================
# DEVELOPMENT SECURITY
# ===============================

security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}

# Conta administrativa local para desenvolvimento
admin.account.email=${ADMIN_EMAIL:admin@ancora.com}
admin.account.password=${ADMIN_PASSWORD:ancoraAdmin}

spring.mail.username=${EMAIL_USERNAME:test@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:123456}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/gestao_condominial_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# na primeira inicializacao use: spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
