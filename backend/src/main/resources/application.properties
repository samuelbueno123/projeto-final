spring.application.name=projeto-final

spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.open-in-view=false

security.client-id=${CLIENT_ID:myclientid}
security.client-secret=${CLIENT_SECRET:myclientsecret}

security.jwt.duration=${JWT_DURATION:86400}

cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:test@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:123456}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.password-recover.token.minutes=${PASSWORD_RECOVER_TOKEN_MINUTES:30}
email.password-recover.uri=${PASSWORD_RECOVER_URI:http://localhost:5173/recover-password/}
marketplaces.stores[mercado-livre].api-base-url=${MERCADO_LIVRE_API_BASE_URL:https://api.mercadolibre.com}
marketplaces.stores[mercado-livre].access-token=${MERCADO_LIVRE_ACCESS_TOKEN:}
marketplaces.stores[mercado-livre].webhook-secret=${MERCADO_LIVRE_WEBHOOK_SECRET:}
marketplaces.stores[mercado-livre].default-recipient-id=${MERCADO_LIVRE_DEFAULT_RECIPIENT_ID:3}
marketplaces.stores[mercado-livre].default-unit-id=${MERCADO_LIVRE_DEFAULT_UNIT_ID:3}

marketplaces.stores[americanas].api-base-url=${AMERICANAS_API_BASE_URL:https://api.americanas.com.br}
marketplaces.stores[americanas].access-token=${AMERICANAS_ACCESS_TOKEN:}
marketplaces.stores[americanas].webhook-secret=${AMERICANAS_WEBHOOK_SECRET:}
marketplaces.stores[americanas].default-recipient-id=${AMERICANAS_DEFAULT_RECIPIENT_ID:3}
marketplaces.stores[americanas].default-unit-id=${AMERICANAS_DEFAULT_UNIT_ID:3}

marketplaces.stores[casas-bahia].api-base-url=${CASAS_BAHIA_API_BASE_URL:https://api.casasbahia.com.br}
marketplaces.stores[casas-bahia].access-token=${CASAS_BAHIA_ACCESS_TOKEN:}
marketplaces.stores[casas-bahia].webhook-secret=${CASAS_BAHIA_WEBHOOK_SECRET:}
marketplaces.stores[casas-bahia].default-recipient-id=${CASAS_BAHIA_DEFAULT_RECIPIENT_ID:3}
marketplaces.stores[casas-bahia].default-unit-id=${CASAS_BAHIA_DEFAULT_UNIT_ID:3}

marketplaces.stores[magalu].api-base-url=${MAGALU_API_BASE_URL:https://api.magalu.com}
marketplaces.stores[magalu].access-token=${MAGALU_ACCESS_TOKEN:}
