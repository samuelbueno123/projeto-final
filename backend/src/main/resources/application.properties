spring.application.name=projeto-final

spring.profiles.active=${APP_PROFILE:dev}
spring.jpa.open-in-view=false

security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:./.secrets/jwt-private.pem}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:./.secrets/jwt-public.pem}

security.jwt.duration=${JWT_DURATION:1800}
security.jwt.refresh-duration=${JWT_REFRESH_DURATION:2592000}

cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.password-recover.token.minutes=${PASSWORD_RECOVER_TOKEN_MINUTES:30}
email.password-recover.uri=${PASSWORD_RECOVER_URI:http://localhost:5173/recover-password/}

# ===============================
# OPENAPI / SWAGGER
# ===============================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true