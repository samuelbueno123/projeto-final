# ===============================
# DATABASE
# ===============================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# ===============================
# OAUTH2 CLIENT
# ===============================

security.client-id=${CLIENT_ID}
security.client-secret=${CLIENT_SECRET}


# ===============================
# JWT SIGNING KEYS
# ===============================

security.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
security.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}


# ===============================
# CORS
# ===============================

cors.origins=${CORS_ORIGINS}


# ===============================
# EMAIL
# ===============================

spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

email.password-recover.uri=${PASSWORD_RECOVER_URI}

# ===============================
# CONNECTION POOL (HIKARI)
# ===============================
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000

# ===============================
# ERROR & LOGGING SETTINGS
# ===============================
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
logging.level.com.cefet_rj.projeto_final=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN