spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-oauth-test.sql

spring.jpa.properties.hibernate.hbm2ddl.import_files=
spring.flyway.enabled=false

security.jwt.private-key-path=./target/test-secrets/jwt-private.pem
security.jwt.public-key-path=./target/test-secrets/jwt-public.pem

security.client-id=test-client
security.client-secret=test-secret

spring.mail.username=test@example.com
spring.mail.password=test-password