name: projeto-final

# ==============================================================================
# DOCKER COMPOSE - BASE STACK (SUBDIRETÓRIO BACKEND)
# ==============================================================================

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - backend-net
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestao_condominial_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-gestao_condominial_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: projeto-final-api:latest
    restart: unless-stopped
    networks:
      - backend-net
      - frontend-net
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      APP_PROFILE: ${APP_PROFILE:-dev}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/gestao_condominial_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      CLIENT_ID: ${CLIENT_ID:-ancora-app}
      CLIENT_SECRET: ${CLIENT_SECRET:-myclientsecret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/.secrets/jwt-private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/.secrets/jwt-public.pem}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1093543407623-ch2dq0uh0bnvrhm6pkf6kd8v75bvr3a0.apps.googleusercontent.com}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-test@gmail.com}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-123456}
      PASSWORD_RECOVER_URI: ${PASSWORD_RECOVER_URI:-http://localhost:5500/#/recover-password/}
    volumes:
      - jwt_keys:/app/.secrets
      - media_pictures:/app/media/pictures
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../projeto-front
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_CLIENT_ID:-1093543407623-ch2dq0uh0bnvrhm6pkf6kd8v75bvr3a0.apps.googleusercontent.com}
    image: projeto-final-frontend:latest
    restart: unless-stopped
    networks:
      - frontend-net
    ports:
      - "${FRONTEND_PORT:-5500}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: projeto-final_postgres_data
  jwt_keys:
    name: projeto-final_jwt_keys
  media_pictures:
    name: projeto-final_media_pictures
