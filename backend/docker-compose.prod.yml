name: projeto-final

# ==============================================================================
# DOCKER COMPOSE - PRODUÇÃO (OVERRIDE HARDENED - BACKEND)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================================

networks:
  backend-net:
    internal: true

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  api:
    restart: always
    environment:
      APP_PROFILE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/gestao_condominial_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_strong_password}
      CLIENT_ID: ${CLIENT_ID:-ancora-app}
      CLIENT_SECRET: ${CLIENT_SECRET:-myclientsecret}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.ancora.com}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/.secrets/jwt-private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/.secrets/jwt-public.pem}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    restart: always
    ports:
      - "80:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
